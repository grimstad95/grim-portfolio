<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast · GRIM</title>
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ─── Intro tekst øverst — samme mønster som Video/Foto ─── */
        .podcast-intro {
            margin-top: var(--nav-height);
            padding: 72px 52px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: end;
        }
        .podcast-intro-title {
            font-family: var(--display);
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1.02;
            color: var(--ink);
        }
        .podcast-intro-text {
            font-size: 15px;
            line-height: 1.85;
            color: var(--ink-dim);
            max-width: 46ch;
        }
        @media (max-width: 860px) {
            .podcast-intro { grid-template-columns: 1fr; gap: 20px; padding: 48px 24px 32px; }
        }

        /* ─── Podcast-raden — alle på én linje, fyller hele bredden ─── */
        .podcast-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            padding: 0 52px 90px;
        }
        @media (max-width: 860px) {
            .podcast-grid { grid-template-columns: repeat(2, 1fr); padding: 0 24px 70px; }
        }

        /* ─── Podcast-kort — rene kort: cover, tittel, kort tekst,
           én tydelig Spotify/YouTube-lenke. Klipp spilles direkte fra
           coveret (avspillingsikon på hover), ingen egne knapper. */
        .podcast-card .card-thumb {
            aspect-ratio: 1 / 1;
            background: var(--bg-elevated);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .podcast-card .card-thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .podcast-card.has-clip .card-thumb { cursor: pointer; }
        .podcast-play {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0);
            transition: background 0.2s;
        }
        .podcast-card.has-clip .card-thumb:hover .podcast-play { background: rgba(0,0,0,0.32); }
        .podcast-play svg {
            width: 42px; height: 42px;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.2s, transform 0.2s;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5));
        }
        .podcast-card.has-clip .card-thumb:hover .podcast-play svg { opacity: 1; transform: scale(1); }

        .podcast-desc {
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--ink-faint);
            margin: 2px 0 12px;
        }
        .podcast-spotify {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-dim);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }
        .podcast-spotify:hover { color: var(--accent-2); }

        /* ─── Modal / spiller — samme "nær-fremtid" spiller som Video ─── */
        .modal { padding: 32px; }
        .modal-inner {
            max-width: 1400px;
            height: 88vh;
            background: #000;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            padding: 0;
            box-shadow:
                0 0 0 1px rgba(245,243,238,0.08),
                0 50px 120px -24px rgba(0,0,0,0.9),
                0 0 70px -22px rgba(198,115,63,0.14);
        }
        .modal-body { display: block; height: 100%; }

        .player { position: absolute; inset: 0; }
        .modal-local-video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
            cursor: pointer;
        }

        .player-back {
            position: absolute;
            top: 22px; left: 24px;
            z-index: 25;
            display: flex; align-items: center; gap: 8px;
            background: none; border: none; padding: 0; margin: 0;
            color: rgba(255,255,255,0.5);
            font-family: var(--sans);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .player-back svg { width: 15px; height: 15px; flex-shrink: 0; }
        .player-back:hover { color: var(--accent-2); }

        .player-title {
            position: absolute;
            top: 24px; right: 26px;
            z-index: 25;
            max-width: 42%;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(10, 20, 18, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 22;
        }
        .player.is-paused .player-center-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        .player-center-btn:hover { border-color: rgba(198,115,63,0.7); }
        .player-center-btn svg { width: 22px; height: 22px; margin-left: 2px; }

        .player-controls-wrap {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            z-index: 24;
            padding: 34px 24px 20px;
            background: linear-gradient(to top, rgba(4,10,9,0.55) 0%, transparent 100%);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
        }
        .player.show-controls .player-controls-wrap,
        .player.is-paused .player-controls-wrap {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .player-scrubber {
            position: relative;
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.16);
            cursor: pointer;
            margin-bottom: 16px;
        }
        .player-scrubber-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            width: 0%;
            background: var(--accent-2);
            border-radius: 3px;
        }
        .player-scrubber-handle {
            position: absolute; top: 50%; left: 0%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 10px rgba(111,156,147,0.6);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.15s ease;
        }
        .player-scrubber:hover .player-scrubber-handle { transform: translate(-50%, -50%) scale(1); }

        .player-controls-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .player-btn {
            background: none; border: none; padding: 0; margin: 0;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .player-btn:hover { color: var(--accent-2); }
        .player-btn svg { width: 17px; height: 17px; }

        .player-time {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.02em;
            color: rgba(255,255,255,0.55);
        }
        .player-time-sep { color: rgba(255,255,255,0.3); font-family: var(--mono); font-size: 10.5px; }
        .player-spacer { flex: 1; }

        @media (max-width: 640px) {
            .modal { padding: 0; }
            .modal-inner { height: 100vh; max-width: none; border-radius: 0; box-shadow: none; }
            .player-title { display: none; }
        }
    </style>
</head>
<body>

    <!-- Intro -->
    <div class="podcast-intro">
        <h1 class="podcast-intro-title">Podcast</h1>
        <p class="podcast-intro-text">Noen podcast prosjekter jeg har produsert.</p>
    </div>

    <div class="podcast-grid" id="grid"></div>

    <!-- Modal — spiller av og til for podcastklipp med video -->
    <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-inner" id="modal-inner">
            <div class="modal-body" id="modal-body">
                <div class="player" id="player">
                    <video id="player-video" class="modal-local-video" playsinline preload="metadata"></video>

                    <button class="player-back" id="modal-close" aria-label="Tilbake">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                        Tilbake
                    </button>
                    <span class="player-title" id="modal-title"></span>

                    <button class="player-center-btn" id="player-center-btn" aria-label="Spill av">
                        <svg id="player-center-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>

                    <div class="player-controls-wrap">
                        <div class="player-scrubber" id="player-scrubber">
                            <div class="player-scrubber-fill" id="player-scrubber-fill"></div>
                            <div class="player-scrubber-handle" id="player-scrubber-handle"></div>
                        </div>
                        <div class="player-controls-row">
                            <button class="player-btn" id="player-play" aria-label="Spill av / pause">
                                <svg id="player-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <span class="player-time" id="player-time-elapsed">0:00</span>
                            <span class="player-time-sep">/</span>
                            <span class="player-time" id="player-time-duration">0:00</span>
                            <span class="player-spacer"></span>
                            <button class="player-btn" id="player-mute" aria-label="Demp / slå på lyd">
                                <svg id="player-mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>
    const BASE  = 'Videoer/';
    const PBASE = 'Videoer/Podcast_Thumbnail/';

    // ─── Podcaster — egen kortstil med lenker ut til Spotify/YouTube ──
    // NB: Spotify-lenkene under er funnet via nettsøk basert på navn — verdt å dobbeltsjekke før publisering.
    const podcasts = [
        {
            name: 'Ikke snakk om det',
            cover: 'Ikke_Snakk_Om_Det.jpeg',
            spotify: 'https://open.spotify.com/show/6QptdFLpXbB6CZozZ3I5kN',
            desc: '«Ikke snakk om det» går i dybden på temaer det kan være vanskelig å snakke om. I samtalen med programlederne Jonas Sevaldrud og Emma Ingebrigtsen blir du bedre kjent med gjestens historie, følelser og tanker på et dypere nivå. Vi håper podkasten bidrar til refleksjon, inspirasjon og mer åpenhet.',
            clips: [
                { title: 'Ikke snakk om det',    file: 'Podcast/Ikke snakk om det_Podcast.mp4' },
                { title: 'Ikke snakk om det II', file: 'Podcast/Ikke Snakk om det_02_Podcast.mp4' },
            ]
        },
        {
            name: 'Fantasypodden',
            cover: 'Fantasypodden.jpg',
            podme: 'https://podme.com/no/podkast/fantasypodden-plnorge/',
            desc: 'FantasyPodden er en Podcast om Fantasy Premier League. Hver uke oppsummerer vi runden som var, tar opp ulike FPL-dilemmaer og deler våre Fantasytips til runden som kommer.',
        },
        {
            name: 'Kontoret med Oskar og Snorre',
            cover: 'Kontoret.jpg',
            spotify: 'https://open.spotify.com/show/79BnplRRoDn3wZCEKklziN',
            desc: 'Hver mandag inviterer Oskar og Snorre en gjest til Kontoret.',
        },
        {
            name: '#pengepodden × Nordnet',
            cover: 'Nordnet_podcast.jpg',
            youtube: 'https://www.youtube.com/watch?v=WAree-wD-qs',
            desc: 'Jeg var innleid som produsent for en episode av pengepodden hos Nordnet.',
        },
        {
            name: 'Av med hjelmen',
            cover: 'Av_med_Hjelmen.webp',
            youtube: 'https://www.youtube.com/@Avmedhjelmen/videos',
            desc: '«Av med hjelmen» tar for seg unike historier og spennende diskusjonsemner innenfor motorsport med både kjente og ukjente gjester som har mer å bidra med enn du kanskje skulle tro.',
        },
    ];

    podcasts.forEach(pod => {
        pod.coverSrc = encodeURI(PBASE + pod.cover);
        if (pod.clips) pod.clips.forEach(c => { c.src = encodeURI(BASE + c.file); });
    });

    const grid       = document.getElementById('grid');
    const modal      = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');

    // ─── Render podcast-kort (lenker ut, ingen flip) ──────
    // Rent kort: cover, tittel, kort tekst, én Spotify-lenke. Har
    // podcasten et klipp, spilles det direkte fra coveret (play-ikon
    // på hover) — ingen egne klipp-knapper.
    podcasts.forEach(pod => {
        const card = document.createElement('div');
        const hasClip = pod.clips && pod.clips.length;
        card.className = 'card podcast-card' + (hasClip ? ' has-clip' : '');

        const playIcon = hasClip
            ? `<div class="podcast-play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,0.4)"/><path d="M10 8l6 4-6 4V8z" fill="#fff"/></svg></div>`
            : '';

        const link = pod.spotify
            ? `<a class="podcast-spotify" href="${pod.spotify}" target="_blank" rel="noopener">Lytt på Spotify ↗</a>`
            : pod.youtube
                ? `<a class="podcast-spotify" href="${pod.youtube}" target="_blank" rel="noopener">Se på YouTube ↗</a>`
                : pod.podme
                    ? `<a class="podcast-spotify" href="${pod.podme}" target="_blank" rel="noopener">Hør på Podme ↗</a>`
                    : '';

        card.innerHTML = `
            <div class="card-thumb">
                <img src="${pod.coverSrc}" alt="${pod.name}">
                ${playIcon}
            </div>
            <div class="card-info">
                <div class="card-title">${pod.name}</div>
                <p class="podcast-desc">${pod.desc}</p>
                ${link}
            </div>
        `;
        if (hasClip) {
            card.querySelector('.card-thumb').addEventListener('click', () => openModal(pod.clips[0]));
        }
        grid.appendChild(card);
    });

    // ─── Spilleren — egne minimalistiske kontroller, ingen native ──
    const PLAY_ICON  = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_ICON = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    const MUTE_ICON_ON  = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>';
    const MUTE_ICON_OFF = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/>';

    const player          = document.getElementById('player');
    const videoEl         = document.getElementById('player-video');
    const playBtn         = document.getElementById('player-play');
    const playIcon        = document.getElementById('player-play-icon');
    const centerBtn       = document.getElementById('player-center-btn');
    const centerIcon      = document.getElementById('player-center-icon');
    const muteBtn         = document.getElementById('player-mute');
    const muteIcon        = document.getElementById('player-mute-icon');
    const scrubber        = document.getElementById('player-scrubber');
    const scrubberFill    = document.getElementById('player-scrubber-fill');
    const scrubberHandle  = document.getElementById('player-scrubber-handle');
    const timeElapsedEl   = document.getElementById('player-time-elapsed');
    const timeDurationEl  = document.getElementById('player-time-duration');

    let hideTimer = null;

    function formatTime(s) {
        if (!isFinite(s) || s < 0) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
    }

    function showControls() {
        player.classList.add('show-controls');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            if (!videoEl.paused) player.classList.remove('show-controls');
        }, 2600);
    }

    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseleave', () => {
        if (!videoEl.paused) player.classList.remove('show-controls');
    });

    function togglePlay() {
        if (videoEl.paused) videoEl.play(); else videoEl.pause();
    }
    videoEl.addEventListener('click', togglePlay);
    playBtn.addEventListener('click', togglePlay);
    centerBtn.addEventListener('click', togglePlay);

    videoEl.addEventListener('play', () => {
        player.classList.remove('is-paused');
        playIcon.innerHTML = PAUSE_ICON;
        centerIcon.innerHTML = PAUSE_ICON;
        showControls();
    });
    videoEl.addEventListener('pause', () => {
        player.classList.add('is-paused');
        playIcon.innerHTML = PLAY_ICON;
        centerIcon.innerHTML = PLAY_ICON;
        clearTimeout(hideTimer);
    });

    videoEl.addEventListener('timeupdate', () => {
        const pct = (videoEl.currentTime / videoEl.duration) * 100 || 0;
        scrubberFill.style.width = pct + '%';
        scrubberHandle.style.left = pct + '%';
        timeElapsedEl.textContent = formatTime(videoEl.currentTime);
    });
    videoEl.addEventListener('loadedmetadata', () => {
        timeDurationEl.textContent = formatTime(videoEl.duration);
    });

    function seek(e) {
        const rect = scrubber.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        if (isFinite(videoEl.duration)) videoEl.currentTime = pct * videoEl.duration;
    }
    scrubber.addEventListener('click', seek);

    muteBtn.addEventListener('click', () => {
        videoEl.muted = !videoEl.muted;
        muteIcon.innerHTML = videoEl.muted ? MUTE_ICON_OFF : MUTE_ICON_ON;
    });

    function openModal(p) {
        stopMedia();

        modalTitle.textContent = p.title;
        videoEl.src = p.src;
        videoEl.muted = false;
        muteIcon.innerHTML = MUTE_ICON_ON;
        scrubberFill.style.width = '0%';
        scrubberHandle.style.left = '0%';
        timeElapsedEl.textContent = '0:00';

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        videoEl.play();
    }

    function stopMedia() {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
    }

    function closeModal() {
        stopMedia();
        modal.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') closeModal();
    });
    </script>
</body>
</html>
