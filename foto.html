<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto · GRIM</title>
    <link rel="icon" type="image/svg+xml" href="/logos/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Denne siden ruller normalt, samme overstyring som Video-siden. */
        body.page-gallery { height: auto; overflow: visible; }
        .gallery-layout { height: auto; margin-top: 0; }
        .gallery-main { overflow-y: visible; }
        .gallery-tabs {
            position: sticky;
            top: var(--nav-height);
            background: var(--bg);
            z-index: 5;
        }

        /* ─── Intro tekst øverst ─── */
        .video-intro {
            margin-top: var(--nav-height);
            padding: 72px 52px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: end;
        }
        .video-intro-title {
            font-family: var(--display);
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1.02;
            color: var(--ink);
        }
        .video-intro-text {
            font-size: 15px;
            line-height: 1.85;
            color: var(--ink-dim);
            max-width: 46ch;
        }
        @media (max-width: 860px) {
            .video-intro { grid-template-columns: 1fr; gap: 20px; padding: 48px 24px 32px; }
        }

        /* ─── Stort fotogitter — samme oppsett som Video-siden:
           3 pr. rad, tett og fylt. ─── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
        }
        @media (max-width: 1100px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
        .gallery-main { padding: 2px 2px 90px; }

        /* ─── Kort — samme stil som Video-siden: statisk thumbnail,
           ingen vending. Kategori/tittel/beskrivelse toner inn som en
           gradient-overlay ved hover. ─── */
        .card-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            background: var(--bg-elevated);
            overflow: hidden;
        }
        .card-thumb img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.5s ease;
            background: var(--bg-elevated);
        }
        .card:hover .card-thumb img { transform: scale(1.04); }

        .card-hover-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(18px, 2.6vw, 30px);
            background: linear-gradient(to top, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.35) 55%, transparent 85%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .card:hover .card-hover-overlay { opacity: 1; }

        .card-back-category {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-2);
            margin-bottom: 10px;
        }
        .card-back-title {
            font-family: var(--display);
            font-size: clamp(1.1rem, 1.8vw, 1.5rem);
            line-height: 1.05;
            color: #fff;
            margin-bottom: 8px;
        }
        .card-back-desc {
            font-size: 12.5px;
            line-height: 1.65;
            color: var(--ink-dim);
            max-width: 42ch;
        }
        .card-back-count {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.45);
            margin-top: 8px;
        }

        /* ─── Bildeviser-modal — samme rene, mørke glass-look som
           videospilleren: avrundet svart flate, tynn teal glødering,
           svevende tilbake/tittel, ingen ekstra kanter eller faner. ─── */
        .modal { padding: 32px; }
        .modal-inner {
            max-width: 1400px;
            height: 88vh;
            background: #000;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            padding: 0;
            box-shadow:
                0 0 0 1px rgba(245,243,238,0.08),
                0 50px 120px -24px rgba(0,0,0,0.9),
                0 0 70px -22px rgba(198,115,63,0.14);
        }
        .modal-body { display: block; height: 100%; position: relative; }

        .viewer { position: absolute; inset: 0; }
        .viewer-scroll {
            position: absolute; inset: 0;
            overflow-y: auto;
            padding: 78px 20px 24px;
        }
        .viewer-scroll::-webkit-scrollbar { width: 8px; }
        .viewer-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 8px; }

        /* Tilbake + tittel — svevende, samme stil som videospilleren */
        .viewer-back {
            position: absolute;
            top: 22px; left: 24px;
            z-index: 25;
            display: flex; align-items: center; gap: 8px;
            background: none; border: none; padding: 0; margin: 0;
            color: rgba(255,255,255,0.5);
            font-family: var(--sans);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .viewer-back svg { width: 15px; height: 15px; flex-shrink: 0; }
        .viewer-back:hover { color: var(--accent-2); }

        .viewer-title {
            position: absolute;
            top: 24px; right: 26px;
            z-index: 25;
            max-width: 50%;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Mini-gitter — "kontaktark" av alle bildene i prosjektet.
           Større ruter enn før — klikk et bilde for å åpne det stort. */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 8px;
        }
        .photo-grid-item {
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            background: #0a0a0a;
            cursor: zoom-in;
        }
        .photo-grid-item img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .photo-grid-item:hover img { transform: scale(1.06); }

        /* ─── Lightbox — ett bilde av gangen, piler i sidene til
           neste/forrige. Helt clean: kun bildet, ingen tekst rundt. ─── */
        .lightbox {
            position: absolute; inset: 0;
            z-index: 30;
            display: flex; align-items: center; justify-content: center;
            padding: 78px 90px 40px;
            background: rgba(0,0,0,0.97);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }
        .lightbox.active { opacity: 1; visibility: visible; }
        .lightbox img {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            display: block;
            box-shadow: 0 60px 140px -30px rgba(0,0,0,0.85);
            border-radius: 3px;
        }

        .lightbox-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 52px; height: 52px;
            border-radius: 50%;
            background: rgba(10, 20, 18, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            cursor: pointer;
            z-index: 35;
            transition: border-color 0.2s, background 0.2s;
        }
        .lightbox-arrow:hover { border-color: rgba(198,115,63,0.7); }
        .lightbox-arrow svg { width: 20px; height: 20px; }
        .lightbox-prev { left: 22px; }
        .lightbox-next { right: 22px; }

        .lightbox-counter {
            position: absolute;
            bottom: 24px; left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            color: rgba(255,255,255,0.5);
        }

        @media (max-width: 640px) {
            .modal { padding: 0; }
            .modal-inner { height: 100vh; max-width: none; border-radius: 0; box-shadow: none; }
            .viewer-title { display: none; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .lightbox { padding: 70px 16px 30px; }
            .lightbox-arrow { width: 42px; height: 42px; }
            .lightbox-prev { left: 8px; }
            .lightbox-next { right: 8px; }
        }
    </style>
</head>
<body class="page-gallery">

    <!-- Intro -->
    <div class="video-intro">
        <h1 class="video-intro-title">Foto</h1>
        <p class="video-intro-text">Et utvalg bilder fra prosjekter jeg har jobbet med.</p>
    </div>

    <div class="gallery-layout">
        <!-- Filterfaner -->
        <nav class="gallery-tabs">
            <button class="gallery-tab active" data-filter="bryllup">Bryllup</button>
            <button class="gallery-tab" data-filter="event">Event</button>
        </nav>

        <!-- Grid -->
        <main class="gallery-main">
            <div class="gallery-grid" id="grid"></div>
        </main>
    </div>

    <!-- Bildeviser-modal -->
    <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-inner">
            <div class="modal-body">
                <div class="viewer" id="viewer">
                    <button class="viewer-back" id="modal-close" aria-label="Tilbake">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                        Tilbake
                    </button>
                    <span class="viewer-title" id="modal-title"></span>

                    <div class="viewer-scroll">
                        <div class="photo-grid" id="photo-grid"></div>
                    </div>

                    <div class="lightbox" id="lightbox">
                        <button class="lightbox-arrow lightbox-prev" id="lightbox-prev" aria-label="Forrige bilde">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <img id="lightbox-img" src="" alt="">
                        <button class="lightbox-arrow lightbox-next" id="lightbox-next" aria-label="Neste bilde">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </button>
                        <span class="lightbox-counter" id="lightbox-counter"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>
    const TBASE = 'Foto/Thumbnails_Nettside/';
    const GBASE = 'Foto/Thumbnails_Nettside/Galleri/';

    // thumb: hovedbilde for prosjektkortet. slug + count: mappe og antall
    // bilder i Galleri/<slug>/01.jpg … NN.jpg, som fylles ut i bildeviseren.
    const projects = [
        { title: 'A sky full of stars – A Coldplay tribute', category: 'event', thumb: 'Brattvag_Janitsjar.jpg', slug: 'brattvag-janitsjar', count: 13,
          desc: 'Ein storslått hyllest til Coldplay sitt songunivers, med stort orkester, band og vokal, arrangert av Brattvåg Janitsjar.' },
        { title: 'Phoenix × Let\'s Move', category: 'event', thumb: 'Lets_Move.jpg', slug: 'lets-move', count: 17,
          desc: 'Danseforestillingen Phoenix av Let\'s Move desember 2025.' },
        { title: 'Identity × Let\'s Move', category: 'event', thumb: 'Lets_Move_02.jpg', slug: 'lets-move-ii', count: 12,
          desc: 'Danseforestillingen Identity av Let\'s Move juni 2026.' },
        { title: 'Charlotte & Jacob', category: 'bryllup', thumb: 'Charlotte_Jacob.jpg', slug: 'charlotte-jacob', count: 9,
          desc: 'Fotografering i bryllupet til Charlotte & Jacob.' },
    ];

    projects.forEach(p => {
        p.thumbSrc = encodeURI(TBASE + p.thumb);
        p.photos = Array.from({ length: p.count }, (_, i) => encodeURI(`${GBASE}${p.slug}/${String(i + 1).padStart(2, '0')}.jpg`));
    });

    const grid          = document.getElementById('grid');
    const sidebar       = document.querySelector('.gallery-tabs');
    const modal         = document.getElementById('modal');
    const modalTitle    = document.getElementById('modal-title');
    const photoGrid     = document.getElementById('photo-grid');
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightbox-img');
    const lightboxCounter = document.getElementById('lightbox-counter');

    let currentPhotos = [];
    let currentIndex  = 0;

    // ─── Render prosjektkort — samme stil som Video-siden ──────
    projects.forEach((p, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.category = p.category;
        card.innerHTML = `
            <div class="card-thumb">
                <img src="${p.thumbSrc}" alt="${p.title}">
                <div class="card-hover-overlay">
                    <span class="card-back-category">${p.category === 'bryllup' ? 'Bryllup' : 'Event'}</span>
                    <h3 class="card-back-title">${p.title}</h3>
                    <p class="card-back-desc">${p.desc}</p>
                    <span class="card-back-count">${p.count} bilder</span>
                </div>
            </div>
        `;
        card.addEventListener('click', () => openViewer(p));
        grid.appendChild(card);
    });

    function applyFilter(filter) {
        grid.querySelectorAll('.card').forEach(card => {
            card.classList.toggle('hidden', card.dataset.category !== filter);
        });
        sidebar.querySelectorAll('.gallery-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });
    }

    sidebar.addEventListener('click', e => {
        const btn = e.target.closest('.gallery-tab');
        if (btn) applyFilter(btn.dataset.filter);
    });

    // ─── Bildeviser — kontaktark av mini-bilder. Klikk et bilde for
    // å åpne det stort i en lightbox, og bla videre med pilene i
    // sidene (eller piltastene) til neste/forrige bilde i prosjektet. ──
    function openViewer(p) {
        modalTitle.textContent = p.title;
        currentPhotos = p.photos;
        photoGrid.innerHTML = p.photos.map((src, i) => `
            <div class="photo-grid-item" data-index="${i}">
                <img src="${src}" alt="${p.title} ${i + 1}" loading="lazy">
            </div>
        `).join('');

        photoGrid.querySelectorAll('.photo-grid-item').forEach(item => {
            item.addEventListener('click', () => openLightbox(+item.dataset.index));
        });

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function openLightbox(index) {
        currentIndex = index;
        renderLightbox();
        lightbox.classList.add('active');
    }

    function renderLightbox() {
        lightboxImg.src = currentPhotos[currentIndex];
        lightboxCounter.textContent = `${currentIndex + 1} / ${currentPhotos.length}`;
    }

    function nextPhoto() { currentIndex = (currentIndex + 1) % currentPhotos.length; renderLightbox(); }
    function prevPhoto() { currentIndex = (currentIndex - 1 + currentPhotos.length) % currentPhotos.length; renderLightbox(); }

    function closeLightbox() {
        lightbox.classList.remove('active');
    }

    document.getElementById('lightbox-next').addEventListener('click', e => { e.stopPropagation(); nextPhoto(); });
    document.getElementById('lightbox-prev').addEventListener('click', e => { e.stopPropagation(); prevPhoto(); });
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    function closeModal() {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        closeLightbox();
        photoGrid.innerHTML = '';
    }

    document.getElementById('modal-close').addEventListener('click', () => {
        if (lightbox.classList.contains('active')) closeLightbox();
        else closeModal();
    });
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') {
            if (lightbox.classList.contains('active')) closeLightbox();
            else closeModal();
        }
        if (lightbox.classList.contains('active')) {
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft')  prevPhoto();
        }
    });

    const hash = window.location.hash.slice(1);
    applyFilter((hash === 'event' || hash === 'bryllup') ? hash : 'bryllup');
    </script>
</body>
</html>
