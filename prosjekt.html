<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosjekt · GRIM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ruller normalt i stedet for det faste viewport-panelet
           gallery-layout bruker på Foto — overstyres her. */
        body.page-gallery { height: auto; overflow: visible; }
        .gallery-layout { height: auto; margin-top: 0; }
        .gallery-main { overflow-y: visible; }
        .gallery-tabs {
            position: sticky;
            top: var(--nav-height);
            background: var(--bg);
            z-index: 5;
        }

        /* ─── Intro tekst øverst ─── */
        .video-intro {
            margin-top: var(--nav-height);
            padding: 72px 52px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: end;
        }
        .video-intro-title {
            font-family: var(--display);
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            line-height: 1.02;
            color: var(--ink);
        }
        .video-intro-text {
            font-size: 15px;
            line-height: 1.85;
            color: var(--ink-dim);
            max-width: 46ch;
        }
        @media (max-width: 860px) {
            .video-intro { grid-template-columns: 1fr; gap: 20px; padding: 48px 24px 32px; }
        }

        /* ─── Stort videogitter — 3 pr. rad, tett og fylt ─── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            position: relative;
            min-height: 200px;
        }
        @media (max-width: 1100px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }
        .gallery-main { padding: 2px 2px 90px; }

        .empty-state {
            display: none;
            padding: 90px 24px;
            text-align: center;
            font-family: var(--mono);
            font-size: 12.5px;
            letter-spacing: 0.05em;
            color: var(--ink-faint);
            grid-column: 1 / -1;
        }
        .empty-state.visible { display: block; }

        /* ─── Flip-card ─── */
        .card { perspective: 2400px; }
        .card-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #0a0a0a;
        }
        .card-flip {
            position: absolute; inset: 0;
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }
        .card:hover .card-flip { transform: rotateY(180deg); }
        .card:hover .card-thumb {
            box-shadow: 0 30px 70px -10px rgba(0,0,0,0.65);
            z-index: 3;
        }

        .card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
        }
        .card-face-front { background: #0a0a0a; }
        .card-face-front img,
        .card-face-front video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .card:hover .card-face-front img,
        .card:hover .card-face-front video { transform: scale(1.06); }

        .card-face-back {
            transform: rotateY(180deg);
            background: #0a0f0e;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: clamp(20px, 3vw, 34px);
        }
        .card-face-back::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--accent);
            z-index: 2;
        }
        .card-back-media {
            position: absolute;
            inset: -10px;
            background-size: cover;
            background-position: center;
            filter: blur(7px);
            opacity: 0.4;
        }
        .card-back-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,15,14,0.35) 0%, rgba(10,15,14,0.92) 100%);
        }
        .card-back-content {
            position: relative;
            z-index: 1;
        }
        .card-back-category {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-2);
            margin-bottom: 12px;
        }
        .card-back-title {
            font-family: var(--display);
            font-size: clamp(1.2rem, 2vw, 1.7rem);
            line-height: 1.05;
            color: var(--ink);
            margin-bottom: 12px;
        }
        .card-back-desc {
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-dim);
            max-width: 42ch;
        }

        /* ─── Modal — videoen fyller nesten hele skjermen, med en
           liten, minimal svart/hvit infolinje flytende nederst.
           Ingen faner eller neste/forrige: hver film åpner i sin
           egen spiller, og man går ut igjen for å velge en annen. */
        .modal { padding: 32px; }
        .modal-inner {
            max-width: 1400px;
            height: 88vh;
            background: #000;
            border: none;
            border-radius: 22px;
            overflow: hidden;
            padding: 0;
            box-shadow:
                0 0 0 1px rgba(45, 212, 196, 0.16),
                0 50px 120px -24px rgba(0,0,0,0.9),
                0 0 90px -18px rgba(45, 212, 196, 0.18);
        }
        .modal-body { display: block; height: 100%; }

        .player { position: absolute; inset: 0; }
        .modal-local-video {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            background: #000;
            cursor: pointer;
        }

        .player-back {
            position: absolute;
            top: 22px; left: 24px;
            z-index: 25;
            display: flex; align-items: center; gap: 8px;
            background: none; border: none; padding: 0; margin: 0;
            color: rgba(255,255,255,0.5);
            font-family: var(--sans);
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .player-back svg { width: 15px; height: 15px; flex-shrink: 0; }
        .player-back:hover { color: var(--accent-2); }

        .player-title {
            position: absolute;
            top: 24px; right: 26px;
            z-index: 25;
            max-width: 42%;
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 60px; height: 60px;
            border-radius: 50%;
            background: rgba(10, 20, 18, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 22;
        }
        .player.is-paused .player-center-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }
        .player-center-btn:hover { border-color: rgba(45,212,196,0.6); }
        .player-center-btn svg { width: 22px; height: 22px; margin-left: 2px; }

        .player-controls-wrap {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            z-index: 24;
            padding: 34px 24px 20px;
            background: linear-gradient(to top, rgba(4,10,9,0.55) 0%, transparent 100%);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
        }
        .player.show-controls .player-controls-wrap,
        .player.is-paused .player-controls-wrap {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .player-scrubber {
            position: relative;
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.16);
            cursor: pointer;
            margin-bottom: 16px;
        }
        .player-scrubber-fill {
            position: absolute; top: 0; left: 0; height: 100%;
            width: 0%;
            background: var(--accent-2);
            border-radius: 3px;
        }
        .player-scrubber-handle {
            position: absolute; top: 50%; left: 0%;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 10px rgba(45,212,196,0.8);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.15s ease;
        }
        .player-scrubber:hover .player-scrubber-handle { transform: translate(-50%, -50%) scale(1); }

        .player-controls-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .player-btn {
            background: none; border: none; padding: 0; margin: 0;
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .player-btn:hover { color: var(--accent-2); }
        .player-btn svg { width: 17px; height: 17px; }

        .player-time {
            font-family: var(--mono);
            font-size: 10.5px;
            letter-spacing: 0.02em;
            color: rgba(255,255,255,0.55);
        }
        .player-time-sep { color: rgba(255,255,255,0.3); font-family: var(--mono); font-size: 10.5px; }
        .player-spacer { flex: 1; }

        @media (max-width: 640px) {
            .modal { padding: 0; }
            .modal-inner { height: 100vh; max-width: none; border-radius: 0; box-shadow: none; }
            .player-title { display: none; }
        }

        /* ─── Profil-hero pr. kategori ────────────────────── */
        .profile-hero {
            position: relative;
            height: 72vh;
            min-height: 460px;
            overflow: hidden;
            background: #060a09;
            border-bottom: 1px solid var(--line);
        }
        .profile-hero-media {
            position: absolute; inset: 0;
        }
        .profile-hero-media img,
        .profile-hero-media video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .profile-hero-media-empty {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(155deg, #16221f 0%, #0a1614 60%, #101f1c 100%);
        }
        .profile-hero-media-empty::after {
            content: 'Bilde kommer snart';
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.06em;
            color: var(--ink-faint);
        }
        .profile-hero-overlay {
            position: absolute; inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 52px;
            background: linear-gradient(to top, rgba(6,10,9,0.92) 0%, rgba(6,10,9,0.35) 45%, rgba(6,10,9,0.15) 100%);
        }
        .profile-hero-category {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-2);
            margin-bottom: 14px;
        }
        .profile-hero-title {
            font-family: var(--display);
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1;
            color: var(--ink);
            margin-bottom: 18px;
        }
        .profile-hero-text {
            font-size: 14.5px;
            line-height: 1.8;
            color: var(--ink-dim);
            max-width: 56ch;
            margin-bottom: 32px;
        }
        .profile-stats {
            display: grid;
            /* auto-fit + fit-content: gridet blir akkurat så bredt som antall
               stat-bokser krever — ingen tom, synlig boks når en kategori har
               færre tall enn de andre (f.eks. 3 i stedet for 4 på TikTok). */
            grid-template-columns: repeat(auto-fit, minmax(110px, 160px));
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            width: fit-content;
            max-width: 100%;
        }
        .profile-stat {
            background: rgba(10,20,18,0.75);
            backdrop-filter: blur(6px);
            padding: 16px 18px;
        }
        .profile-stat-value {
            font-family: var(--display);
            font-size: clamp(1.3rem, 2.6vw, 1.9rem);
            color: var(--ink);
            line-height: 1;
            margin-bottom: 6px;
        }
        .profile-stat-label {
            font-family: var(--mono);
            font-size: 9.5px;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--ink-dim);
        }
        .profile-stats-empty {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.05em;
            color: var(--ink-faint);
        }
        @media (max-width: 760px) {
            .profile-hero { height: auto; min-height: 0; }
            .profile-hero-overlay { position: relative; padding: 36px 24px; }
            .profile-hero-media { position: relative; height: 46vh; }
            .profile-stats { grid-template-columns: repeat(2, 1fr); width: 100%; }
        }
    </style>
</head>
<body class="page-gallery">

    <!-- Intro -->
    <div class="video-intro">
        <h1 class="video-intro-title">Prosjekter</h1>
        <p class="video-intro-text">Noen av de større prosjektene jeg har gjort.</p>
    </div>

    <div class="gallery-layout">
        <nav class="gallery-tabs">
            <button class="gallery-tab active" data-filter="oskar-westerlin">Oskar Westerlin</button>
            <button class="gallery-tab" data-filter="kontoret">Kontoret</button>
            <button class="gallery-tab" data-filter="skjessen">Skjessen</button>
            <button class="gallery-tab" data-filter="tiktok">TikTok</button>
        </nav>

        <section class="profile-hero" id="profile-hero"></section>

        <main class="gallery-main">
            <div class="gallery-grid" id="grid">
                <div class="empty-state" id="empty-state">Innhold kommer snart for denne kategorien.</div>
            </div>
        </main>
    </div>

    <!-- Modal — én film av gangen, ingen videre navigasjon herfra -->
    <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-inner" id="modal-inner">
            <div class="modal-body" id="modal-body">
                <div class="player" id="player">
                    <video id="player-video" class="modal-local-video" playsinline preload="metadata"></video>

                    <button class="player-back" id="modal-close" aria-label="Tilbake">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
                        Tilbake
                    </button>
                    <span class="player-title" id="modal-title"></span>

                    <button class="player-center-btn" id="player-center-btn" aria-label="Spill av">
                        <svg id="player-center-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>

                    <div class="player-controls-wrap">
                        <div class="player-scrubber" id="player-scrubber">
                            <div class="player-scrubber-fill" id="player-scrubber-fill"></div>
                            <div class="player-scrubber-handle" id="player-scrubber-handle"></div>
                        </div>
                        <div class="player-controls-row">
                            <button class="player-btn" id="player-play" aria-label="Spill av / pause">
                                <svg id="player-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <span class="player-time" id="player-time-elapsed">0:00</span>
                            <span class="player-time-sep">/</span>
                            <span class="player-time" id="player-time-duration">0:00</span>
                            <span class="player-spacer"></span>
                            <button class="player-btn" id="player-mute" aria-label="Demp / slå på lyd">
                                <svg id="player-mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav.js"></script>
    <script>
    const BASE  = 'Videoer/';
    const TBASE = 'Videoer/Thumbnails_Nettside/';

    // services: hvilke av Idé / Manus / Klipp / Regi / Foto som er utført
    // orientation: 'landscape' (16:9) or 'portrait' (9:16)
    // thumb: eget bilde pr. video, hentet direkte fra filmen (frame grab) —

        const projects = [
        // ─── TikTok

        // ─── Skjessen
        { title: 'Gigantisk kebab hos Döner Bros', category: 'skjessen', orientation: 'landscape',

        { title: 'David er med å rater: Mike\'s Corner', category: 'skjessen', orientation: 'landscape',

          desc: 'Skjessen rater Mike\'s Corner.', services: ['klipp'] },
    ];

    const categoryLabels = {
        'oskar-westerlin': 'Oskar Westerlin', kontoret: 'Kontoret', skjessen: 'Skjessen', tiktok: 'TikTok'
    };

    const ALL_SERVICES = [
        { key: 'idé',   label: 'Idé' },
        { key: 'manus', label: 'Manus' },
        { key: 'klipp', label: 'Klipp' },
        { key: 'regi',  label: 'Regi' },
        { key: 'foto',  label: 'Foto' },
    ];

    // ─── Profil pr. kategori — stor thumbnail + tekst + statistikk ─
    // Tall hentet manuelt fra YouTube/TikTok (11.08.2026) — se merknad per
    // kategori. Oppdater datoen under når tallene friskes opp neste gang.
    // Samme rekkefølge/stil overalt: Visninger – Følgere – Likes – Videoer.
    // YouTube-only-profilene mangler et offentlig totalt likes-tall for hele
    // kanalen (YouTube viser ikke dette noe sted), så det feltet er utelatt
    // der i stedet for å gjette.
    const categoryProfiles = {
        'oskar-westerlin': {
            title: 'Oskar Westerlin',
            text: 'Produksjon av youtube videoer som gikk på hovedkanalen til Oskar Westerlin.',
            media: { type: 'image', src: TBASE + 'Oskar Westerlin.jpg' },
            // Kun YouTube, på forespørsel.
            stats: [
                { value: 19317993, suffix: '', label: 'Visninger' },
                { value: 95700,    suffix: '', label: 'Følgere' },
                { value: 798,      suffix: '', label: 'Videoer' },
            ],
        },
        kontoret: {
            title: 'Kontoret',
            text: 'Jeg var med på oppstarten av podcasten og hadde produsent + klipp ansvar for 35+ episoder.',
            media: { type: 'image', src: TBASE + 'Kontoret.jpg' },
            // Kun YouTube.
            stats: [
                { value: 8242310, suffix: '', label: 'Visninger' },
                { value: 69100,   suffix: '', label: 'Følgere' },
                { value: 146,     suffix: '', label: 'Videoer' },
                // TikTok: tiktok.com/@kontoretpodcast — følgertallet fikk
                // jeg ikke hentet ut (TikTok blokkerte gjentatte forsøk).
            ],
        },
        skjessen: {
            title: 'Skjessen',
            text: 'I hovedsak en snapchat serie hvor Oskar ratet restauranter rundt om i Oslo. Hadde ansvar for video + klipp 1-3 sesong av Skjessen, og var med på oppstarten av hele serien.',
            media: { type: 'image', src: TBASE + 'Skjessen.jpg' },
            // YouTube-tallene (Visninger/Følgere/Videoer) + Snapchat-følgere
            // lagt til som egen stat 27.08.2026, oppgitt manuelt av Bjørnar.
            stats: [
                { value: 3582948, suffix: '', label: 'Visninger' },
                { value: 16000,   suffix: '', label: 'Følgere YouTube' },
                { value: 147000,  suffix: '', label: 'Følgere Snapchat' },
                { value: 137,     suffix: '', label: 'Videoer' },
            ],
        },
        tiktok: {
            title: 'AI Football',
            text: 'Et TikTok-konsept der AI gjenskaper fotballstjerner i Lego-estetikk. «Guess the player» engasjerte millioner av fotballfans globalt, helt uten betalt distribusjon.',
            media: { type: 'image', src: TBASE + 'Thumbnail_Prosjekter/Tiktok_Lego.jpg' },
            stats: [
                { value: 180000000, suffix: '+', label: 'Visninger' },
                { value: 159200,    suffix: '',  label: 'Følgere' },
                { value: 6700000,   suffix: '',  label: 'Likes' },
                { value: 420,       suffix: '+', label: 'Videoer' },
            ],
        },
    };

    projects.forEach(p => { p.src = encodeURI(BASE + p.file); });

    const grid          = document.getElementById('grid');
    const emptyState    = document.getElementById('empty-state');
    const sidebar       = document.querySelector('.gallery-tabs');
    const profileHero   = document.getElementById('profile-hero');
    const modal         = document.getElementById('modal');
    const modalTitle    = document.getElementById('modal-title');

    // ─── Render prosjektkort (flip-kort) ──────────────────
    projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.category = p.category;

        const thumbUrl = p.thumb ? encodeURI(TBASE + p.thumb) : null;
        const frontMedia = thumbUrl
            ? `<img src="${thumbUrl}" alt="${p.title}">`
            : `<video src="${p.src}" muted playsinline preload="metadata"></video>`;
        const backMedia = thumbUrl
            ? `<div class="card-back-media" style="background-image:url('${thumbUrl}')"></div>`
            : '';

        card.innerHTML = `
            <div class="card-thumb">
                <div class="card-flip">
                    <div class="card-face card-face-front">
                        ${frontMedia}
                    </div>
                    <div class="card-face card-face-back">
                        ${backMedia}
                        <div class="card-back-content">
                            <span class="card-back-category">${categoryLabels[p.category]}</span>
                            <h3 class="card-back-title">${p.title}</h3>
                            <p class="card-back-desc">${p.desc}</p>
                        </div>
                    </div>
                </div>
            </div>
        `;
        card.addEventListener('click', () => openModal(p));
        grid.appendChild(card);
    });

    // ─── Filter ────────────────────────────────────────────
    function applyFilter(filter) {
        let visibleCount = 0;
        grid.querySelectorAll('.card').forEach(card => {
            const show = card.dataset.category === filter;
            card.classList.toggle('hidden', !show);
            if (show) visibleCount++;
        });
        emptyState.classList.toggle('visible', visibleCount === 0);
        sidebar.querySelectorAll('.gallery-tab').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        renderHero(filter);
    }

    // ─── Profil-hero: stor thumbnail + tekst + tellende statistikk ─
    function renderHero(filter) {
        const p = categoryProfiles[filter];
        if (!p) { profileHero.innerHTML = ''; return; }

        const mediaHTML = p.media
            ? (p.media.type === 'video'
                ? `<video src="${encodeURI(p.media.src)}" autoplay muted loop playsinline></video>`
                : `<img src="${encodeURI(p.media.src)}" alt="${p.title}">`)
            : `<div class="profile-hero-media-empty"></div>`;

        const statsHTML = p.stats
            ? p.stats.map((s, i) => `
                <div class="profile-stat">
                    <div class="profile-stat-value" data-value="${s.value}" data-suffix="${s.suffix}">0</div>
                    <div class="profile-stat-label">${s.label}</div>
                </div>`).join('')
            : `<p class="profile-stats-empty">Statistikk kommer snart.</p>`;

        profileHero.innerHTML = `
            <div class="profile-hero-media">${mediaHTML}</div>
            <div class="profile-hero-overlay">
                <span class="profile-hero-category">${categoryLabels[filter]}</span>
                <h2 class="profile-hero-title">${p.title}</h2>
                <p class="profile-hero-text">${p.text}</p>
                <div class="profile-stats">${statsHTML}</div>
            </div>
        `;

        profileHero.querySelectorAll('.profile-stat-value').forEach(el => {
            animateCount(el, +el.dataset.value, el.dataset.suffix);
        });
    }

    function formatStatNumber(n) {
        if (n >= 1000000) {
            const v = n / 1000000;
            return (Number.isInteger(v) ? v : v.toFixed(1)) + 'M';
        }
        if (n >= 1000) {
            const v = n / 1000;
            return (Number.isInteger(v) ? v : v.toFixed(1)) + 'K';
        }
        return Math.round(n).toString();
    }

    function animateCount(el, target, suffix) {
        const duration = 1500;
        const start = performance.now();
        function tick(now) {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = formatStatNumber(target * eased) + (progress >= 1 ? suffix : '');
            if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    sidebar.addEventListener('click', e => {
        const btn = e.target.closest('.gallery-tab');
        if (btn) applyFilter(btn.dataset.filter);
    });

    // ─── Spilleren — egne minimalistiske kontroller, ingen native ──
    const PLAY_ICON  = '<path d="M8 5v14l11-7z"/>';
    const PAUSE_ICON = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    const MUTE_ICON_ON  = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>';
    const MUTE_ICON_OFF = '<path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M16 9l5 6M21 9l-5 6"/>';

    const player          = document.getElementById('player');
    const videoEl         = document.getElementById('player-video');
    const playBtn         = document.getElementById('player-play');
    const playIcon        = document.getElementById('player-play-icon');
    const centerBtn       = document.getElementById('player-center-btn');
    const centerIcon      = document.getElementById('player-center-icon');
    const muteBtn         = document.getElementById('player-mute');
    const muteIcon        = document.getElementById('player-mute-icon');
    const scrubber        = document.getElementById('player-scrubber');
    const scrubberFill    = document.getElementById('player-scrubber-fill');
    const scrubberHandle  = document.getElementById('player-scrubber-handle');
    const timeElapsedEl   = document.getElementById('player-time-elapsed');
    const timeDurationEl  = document.getElementById('player-time-duration');

    let hideTimer = null;

    function formatTime(s) {
        if (!isFinite(s) || s < 0) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
    }

    function showControls() {
        player.classList.add('show-controls');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            if (!videoEl.paused) player.classList.remove('show-controls');
        }, 2600);
    }

    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseleave', () => {
        if (!videoEl.paused) player.classList.remove('show-controls');
    });

    function togglePlay() {
        if (videoEl.paused) videoEl.play(); else videoEl.pause();
    }
    videoEl.addEventListener('click', togglePlay);
    playBtn.addEventListener('click', togglePlay);
    centerBtn.addEventListener('click', togglePlay);

    videoEl.addEventListener('play', () => {
        player.classList.remove('is-paused');
        playIcon.innerHTML = PAUSE_ICON;
        centerIcon.innerHTML = PAUSE_ICON;
        showControls();
    });
    videoEl.addEventListener('pause', () => {
        player.classList.add('is-paused');
        playIcon.innerHTML = PLAY_ICON;
        centerIcon.innerHTML = PLAY_ICON;
        clearTimeout(hideTimer);
    });

    videoEl.addEventListener('timeupdate', () => {
        const pct = (videoEl.currentTime / videoEl.duration) * 100 || 0;
        scrubberFill.style.width = pct + '%';
        scrubberHandle.style.left = pct + '%';
        timeElapsedEl.textContent = formatTime(videoEl.currentTime);
    });
    videoEl.addEventListener('loadedmetadata', () => {
        timeDurationEl.textContent = formatTime(videoEl.duration);
    });

    function seek(e) {
        const rect = scrubber.getBoundingClientRect();
        const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        if (isFinite(videoEl.duration)) videoEl.currentTime = pct * videoEl.duration;
    }
    scrubber.addEventListener('click', seek);

    muteBtn.addEventListener('click', () => {
        videoEl.muted = !videoEl.muted;
        muteIcon.innerHTML = videoEl.muted ? MUTE_ICON_OFF : MUTE_ICON_ON;
    });

    function openModal(p) {
        stopMedia();

        modalTitle.textContent = p.title;
        videoEl.src = p.src;
        videoEl.muted = false;
        muteIcon.innerHTML = MUTE_ICON_ON;
        scrubberFill.style.width = '0%';
        scrubberHandle.style.left = '0%';
        timeElapsedEl.textContent = '0:00';

        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        videoEl.play();
    }

    function stopMedia() {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
    }

    function closeModal() {
        stopMedia();
        modal.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.addEventListener('keydown', e => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'Escape') closeModal();
    });

    const hash = window.location.hash.slice(1);
    applyFilter((hash && categoryLabels[hash]) ? hash : 'oskar-westerlin');
    </script>
</body>
</html>
